[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["pi_client/venv", "migrations/versions/script.py.mako"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length is a formatter concern, not a lint failure
]

[tool.ruff.lint.flake8-bugbear]
# B008 warns about function calls in argument defaults because the result is
# evaluated once and shared. That's precisely how FastAPI declares dependencies
# and parameter metadata — the call IS the declaration, and the objects are
# treated as immutable descriptors, never mutated per-request.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Header",
    "fastapi.Path", "fastapi.Body", "fastapi.Form",
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E402"]  # alembic revision files import after module docstring
"*/tests/*.py" = ["E402"]  # conftest.py sys.path insertion must precede test-module imports

[tool.pytest.ini_options]
testpaths = ["pi_client/tests", "migrations/tests", "consumer/tests", "api/tests", "bot/tests"]
asyncio_mode = "auto"
