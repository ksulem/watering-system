[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["pi_client/venv", "migrations/versions/script.py.mako"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length is a formatter concern, not a lint failure
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E402"]  # alembic revision files import after module docstring
"*/tests/*.py" = ["E402"]  # conftest.py sys.path insertion must precede test-module imports

[tool.pytest.ini_options]
testpaths = ["pi_client/tests", "migrations/tests"]
asyncio_mode = "auto"
