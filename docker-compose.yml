# Bound container log size. The default json-file driver grows without limit —
# one crash-looping service can fill the disk overnight, which on this box would
# take TimescaleDB down with it. 10 MB x 3 files per service caps the worst case
# at ~240 MB across all eight.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    logging: *default-logging
    environment:
      POSTGRES_DB: plantmonitor
      POSTGRES_USER: plantuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Default TimescaleDB tuning targets the host's full detected memory
    # (autotune reads container limits, not a fixed default) - on this 1GB
    # VM that's too aggressive for a box also running Mosquitto/Consumer/
    # API/Bot/Nginx. Cap shared_buffers explicitly instead of trusting
    # autotune. Revisit these once/if this migrates to the 6GB Ampere box.
    command:
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=256MB
      - -c
      - max_connections=40
      - -c
      - work_mem=4MB
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"   # close externally after setup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantuser -d plantmonitor"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build: ./migrations
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql+asyncpg://plantuser:${DB_PASSWORD}@timescaledb/plantmonitor
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: "no"

  mosquitto:
    image: eclipse-mosquitto:2
    logging: *default-logging
    ports:
      - "8883:8883"     # external TLS — Pi devices
      # 1883 not exposed externally — Docker network only
    environment:
      MQTT_CONSUMER_PASSWORD: ${MQTT_CONSUMER_PASSWORD}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -u backend_consumer -P $$MQTT_CONSUMER_PASSWORD -t 'health/check' -m '1' -q 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: ./api
    logging: *default-logging
    # No host port published on purpose. Session tokens over plain HTTP on a
    # public IP would be sniffable, and there's still no domain to get a
    # certificate for. Nginx + TLS in Phase 8 is what makes this reachable.
    environment:
      DATABASE_URL: postgresql://plantuser:${DB_PASSWORD}@timescaledb/plantmonitor
      # Blank until the bot exists (Phase 6). While unset, /auth/session returns
      # 503 and every other endpoint is locked — the API fails closed.
      BOT_TOKEN: ${BOT_TOKEN:-}
      OWNER_USER_ID: ${OWNER_USER_ID:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    restart: unless-stopped

  consumer:
    build: ./consumer
    logging: *default-logging
    environment:
      # Plain postgresql:// for the same reason as cmd_dispatcher below - raw
      # asyncpg, which rejects the "+asyncpg" SQLAlchemy dialect prefix.
      DATABASE_URL: postgresql://plantuser:${DB_PASSWORD}@timescaledb/plantmonitor
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_CONSUMER_USERNAME: backend_consumer
      MQTT_CONSUMER_PASSWORD: ${MQTT_CONSUMER_PASSWORD}
      # Unset until the bot exists (Phase 6): alerts are still written to the
      # alerts table, only the Telegram push is skipped.
      BOT_TOKEN: ${BOT_TOKEN:-}
      OWNER_CHAT_ID: ${OWNER_CHAT_ID:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
    # A hard cap, not a reservation. On a 1 GB VM an unbounded leak here would
    # push TimescaleDB into swap and take the whole stack down; better that the
    # Consumer alone gets OOM-killed and restarted. Steady-state RSS is ~80 MB.
    mem_limit: 256m
    restart: unless-stopped

  cmd_dispatcher:
    build: ./cmd_dispatcher
    logging: *default-logging
    environment:
      # Plain postgresql:// - this service uses asyncpg directly (not
      # SQLAlchemy), which doesn't understand the "+asyncpg" dialect prefix
      # that migrate's DATABASE_URL uses.
      DATABASE_URL: postgresql://plantuser:${DB_PASSWORD}@timescaledb/plantmonitor
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_DISPATCHER_USERNAME: backend_dispatcher
      MQTT_DISPATCHER_PASSWORD: ${MQTT_DISPATCHER_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build: ./bot
    logging: *default-logging
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is required to run the bot}
      OWNER_USER_ID: ${OWNER_USER_ID:?OWNER_USER_ID is required to run the bot}
      # Shared with the API: the bot signs its own session tokens rather than
      # going through /auth/session, which only a Mini App can satisfy.
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required to run the bot}
      API_BASE: http://api:8000
      WEBHOOK_URL: https://${DOMAIN:?DOMAIN is required to run the bot}/webhook
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?WEBHOOK_SECRET is required - generate with openssl rand -hex 32}
      # Empty until Phase 7 serves the Mini App; the dashboard button is hidden
      # rather than pointing at a 404.
      MINI_APP_URL: ${MINI_APP_URL:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 192m
    restart: unless-stopped

  # TLS terminator and the only externally-reachable service. Not started until
  # DOMAIN is set and scripts/init-letsencrypt.sh has issued a certificate —
  # nginx won't boot without the cert files its config references.
  nginx:
    image: nginx:alpine
    logging: *default-logging
    profiles: ["web"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
      # Without this filter envsubst would also replace nginx's own $host,
      # $remote_addr, $scheme ... with empty strings.
      NGINX_ENVSUBST_FILTER: "DOMAIN"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
      # nginx resolves proxy_pass hostnames at startup, so `bot` must already
      # exist or nginx refuses to boot at all — not just for /webhook.
      bot:
        condition: service_healthy
    mem_limit: 64m
    restart: unless-stopped

volumes:
  timescaledb_data:
  mosquitto_data:
